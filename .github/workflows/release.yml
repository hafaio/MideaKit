# Create the GitHub release for a tag (a Swift package has no registry to publish to).
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 0.3.0)"
        required: true
        type: string

permissions:
  contents: write # create the GitHub release

jobs:
  github-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --generate-notes --verify-tag
