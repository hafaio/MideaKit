# Cut a release: the sole writer to main -- tag, then dispatch release + docs off the tag.
name: cut
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # push the tag
  actions: write # dispatch release + docs

jobs:
  gate:
    uses: ./.github/workflows/build.yml

  cut:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0 # tag history drives the next version
      - name: Tag and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          current=${current:-0.0.0}
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${version}" -m "${version}"
          git push origin "${version}"
          # token-pushed tags don't fire on:push, so dispatch instead
          gh workflow run release.yml --ref main -f tag="${version}"
          gh workflow run docs.yml --ref main -f tag="${version}"
